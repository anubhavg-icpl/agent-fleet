[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:ollama]
command=/usr/bin/ollama serve
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:open-webui]
command=bash start.sh
directory=/app
autostart=true
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
