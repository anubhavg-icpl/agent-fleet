[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:openmuse-api]
command=node dist/apps/server/src/index.js
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:openmuse-browser]
command=node --experimental-strip-types src/index.ts
directory=/app/worker
user=pwuser
autostart=true
autorestart=true
startretries=999
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=WORKER_DATA_DIR="/data/browser-profiles",WORKER_HOST="127.0.0.1"
stopasgroup=true
killasgroup=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
