name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the static site
        run: |
          mkdir -p _site/chat
          cp docs/index.html _site/index.html
          cp spaces/chat/index.html \
             spaces/chat/app.js \
             spaces/chat/chat-worker.js \
             spaces/chat/models.js \
             spaces/chat/style.css \
             spaces/chat/icon.svg \
             spaces/chat/manifest.webmanifest \
             _site/chat/
          : > _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
